<!-- =============== Sign up as user ==================== -->
<div class="signin-wrap" *ngIf="loginType == 'user' || loginType == 'department'">
    <div class="signin-container">
      <div class="signin-form">
        <p class="logo d-flex justify-content-center align-items-center">
        </p>
        <div class="signin w-100 m-auto">
          <form [formGroup]="VerifyOtpForm">
            <h1 class="h3 mb-5 fw-normal text-center">Verify OTP</h1>


            <div class="mb-3">
              <label for="otp" class="form-label">OTP</label>
              <input type="number" class="form-control form-control-lg" id="otp" placeholder="Enter OTP"
                formControlName="otp" required />
              @if (VerifyOtpForm.get('otp')?.touched && VerifyOtpForm.get('otp')?.invalid) {
              <mat-error>{{getValue(VerifyOtpForm.get('otp'))}}</mat-error>
              }
            </div>

            <p class="mt-5 mb-0 text-body-secondary" (click)="moveTo('signin')">Already have an account? Sign In</p>

  
            <button class="btn btn-primary w-100 py-2 signin-btn mt-5" type="submit" (click)="onVerifyOtp()">
              Verify
            </button>
            <!-- <p class="mt-5 mb-3 text-body-secondary">© 2024</p> -->
          </form>
        </div>
      </div>
    </div>
  </div>
