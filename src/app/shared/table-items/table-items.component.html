<div class="custom-table">
  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z8 mat-custom-table"
  >
    <ng-container
      *ngFor="let columnName of columnNames"
      [matColumnDef]="columnName"
    >
      <th mat-header-cell *matHeaderCellDef>{{ capitalize(columnName) }}</th>
      <td mat-cell *matCellDef="let row" >
      <ng-container *ngIf="columnName !== 'action'; else actionTemplate">
        {{ row[columnName] }}
      </ng-container>
      <ng-template #actionTemplate>
        <button mat-button (click)="editAction(row,columnName)">Edit</button>
      </ng-template>

      </td>
      <!-- <td mat-cell *matCellDef="let row" >{{row[columnName]}}</td> -->
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columnNames"></tr>
    <tr mat-row *matRowDef="let row; columns: columnNames"></tr>
  </table>
</div>
